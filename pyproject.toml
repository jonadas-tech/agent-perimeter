[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "agentic-perimeter"
version = "0.3.1"
description = "Passive external attack surface scanner for MCP supply-chain provenance, agent discovery, and DNS-AID/OAuth perimeter hygiene."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [
    { name = "Jonadas Techio" },
]
keywords = [
    "mcp",
    "agentic-security",
    "owasp",
    "easm",
    "dns-aid",
    "oauth",
    "supply-chain-security",
    "passive-recon",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/jonadas-tech/agentic-perimeter"
Repository = "https://github.com/jonadas-tech/agentic-perimeter"
Documentation = "https://github.com/jonadas-tech/agentic-perimeter/blob/main/docs/state_of_external_agentic_exposure_2027.md"
Issues = "https://github.com/jonadas-tech/agentic-perimeter/issues"

[project.scripts]
agentic-perimeter = "agentic_perimeter.cli:main"
agentic-perimeter-mcp = "agentic_perimeter.mcp_server:main"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_perimeter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
