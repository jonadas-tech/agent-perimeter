name: Publish to Official MCP Registry

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Publish to PyPI"]
    types: [completed]

permissions:
  id-token: write
  contents: read

jobs:
  publish-mcp:
    name: Publish server.json via GitHub OIDC
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download & verify mcp-publisher v1.8.16
        run: |
          set -euo pipefail
          curl -fsSLO https://github.com/modelcontextprotocol/registry/releases/download/v1.8.16/mcp-publisher_linux_amd64.tar.gz
          curl -fsSLO https://github.com/modelcontextprotocol/registry/releases/download/v1.8.16/registry_1.8.16_checksums.txt
          grep "mcp-publisher_linux_amd64.tar.gz$" registry_1.8.16_checksums.txt | sha256sum -c -
          tar -xzf mcp-publisher_linux_amd64.tar.gz
      - name: Validate & publish to Official MCP Registry
        run: |
          set -euo pipefail
          ./mcp-publisher validate server.json
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish server.json
